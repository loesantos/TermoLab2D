# Testes automáticos a cada envio (push) e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas do sistema para o Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Dependências Python
        run: python -m pip install -r requirements.txt

      - name: Compilar o simulador e os testes C++
        run: make build/simulator build/test_physics

      - name: Testes de física (C++)
        run: ./build/test_physics

      - name: Testes Python
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Teste de fumaça da interface (todos os casos)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_app.py
