# Gera e testa os instaladores; ao enviar uma tag "v*" (ex.: v1.0), publica-os em Releases.
#   git tag v1.0 && git push origin v1.0
# Também pode ser disparado à mão em Actions → Instaladores → Run workflow (sem publicar).
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Pacote .deb (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "TERMOLAB2D_VERSION=$v" >> "$GITHUB_ENV"

      - name: Ferramentas e bibliotecas usadas pelo Qt (para calcular as dependências do pacote)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ zstd unzip dpkg-dev binutils xvfb \
            libdbus-1-3 libegl1 libgl1 libfontconfig1 libfreetype6 libglib2.0-0t64 libx11-6 libx11-xcb1 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libzstd1 libgtk-3-0t64
          python -m pip install pillow

      - name: Gerar o .deb
        run: python packaging/linux/build_deb.py

      - name: Instalar e testar o pacote
        run: |
          sudo apt-get install -y ./instalador/termolab2d_*_amd64.deb
          QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1600x1000x24" \
            /opt/termolab2d/python/bin/python3 tests/smoke_app.py --app /opt/termolab2d/app
          sudo apt-get remove -y termolab2d
          test ! -e /opt/termolab2d

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: instalador/*.deb
          if-no-files-found: error

  windows:
    name: Instalador do Windows (gerado no Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "TERMOLAB2D_VERSION=$v" >> "$GITHUB_ENV"

      - name: MinGW-w64 e NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix nsis zstd unzip

      - name: Gerar o instalador
        run: python packaging/windows/build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: instalador/*.exe
          if-no-files-found: error

  testar-windows:
    name: Testar o instalador num Windows de verdade
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: instalador

      - name: Instalar (modo silencioso)
        shell: pwsh
        run: |
          $exe = Get-ChildItem instalador\*.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\TermoLab2D'
          if (-not (Test-Path "$dir\python\pythonw.exe")) { throw "instalação não encontrada em $dir" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\TermoLab2D\TermoLab2D.lnk")) { throw "atalho do menu Iniciar ausente" }

      - name: Rodar todos os casos com o Python instalado
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\TermoLab2D'
          & "$dir\python\python.exe" tests\smoke_app.py --app "$dir\app"
          if ($LASTEXITCODE -ne 0) { throw "teste de fumaça falhou" }

      - name: Desinstalar
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\TermoLab2D'
          Start-Process -FilePath "$dir\Desinstalar.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 15
          if (Test-Path "$dir\python") { throw "a desinstalação deixou arquivos em $dir" }

  publicar:
    name: Publicar em Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, windows, testar-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      - name: Criar a versão com os instaladores e o manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notas.md <<NOTAS
          ## TermoLab2D $v

          **Windows 10/11 (64 bits):** baixe \`TermoLab2D-$v-instalador.exe\` e execute. A instalação é só para o
          seu usuário e não pede administrador. Como o instalador não é assinado, o Windows pode mostrar
          “O Windows protegeu o computador”: clique em *Mais informações → Executar assim mesmo*.

          **Debian, Ubuntu, Mint e derivados (64 bits):** baixe \`termolab2d_$v-1_amd64.deb\` e instale com
          \`sudo apt install ./termolab2d_$v-1_amd64.deb\`. Requer Debian 11+, Ubuntu 20.04+ ou Mint 20+.

          **Manual:** \`Manual_TermoLab2D.pdf\` (também disponível no próprio programa, tecla F1).
          NOTAS
          gh release create "$GITHUB_REF_NAME" artefatos/* Manual_TermoLab2D.pdf \
            --title "TermoLab2D $v" --notes-file notas.md
