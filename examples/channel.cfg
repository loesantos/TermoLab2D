# Caixa 40 x 20 dividida por uma parede central com canal aberto.
# Parede: 19 <= x < 21. Canal: 8 <= y < 12.
# Inicialmente, todas as partículas estão na câmara esquerda: x < 19.
geometry = channel_box.vtk
initial_x_min = 0.0
initial_x_max = 0.475
particles = 1500
temperature = 1.0
mass = 1.0
charge = 1.0
boltzmann = 1.0
coulomb_constant = 1.0
cutoff = 3.0
softening = 0.05
dt = 0.001
steps = 20000
output_every = 40
threads = 8
seed = 42
# Para partículas livres, sem interação entre si, use charge = 0.
