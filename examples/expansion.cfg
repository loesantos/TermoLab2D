# Expansão no plano xy: caixa 40 x 20, inicialmente ocupada só à esquerda.
# O corte x = 20 limita apenas o sorteio inicial; não existe parede central.
# Unidades reduzidas. As velocidades mantêm a distribuição térmica 2D.
geometry = expansion_box.vtk
initial_x_min = 0.0
initial_x_max = 0.5
particles = 1500
temperature = 1.0
mass = 1.0
charge = 1.0
boltzmann = 1.0
coulomb_constant = 1.0
cutoff = 3.0
softening = 0.05
dt = 0.001
steps = 20000
output_every = 40
threads = 8
seed = 42
# Para um gás de partículas livres sem interação, use charge = 0.
